name: Revisar lote TudoGostoso
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspecionar regras ou coletar candidatas após revisão dos termos
        required: true
        default: inspect
        type: choice
        options: [inspect, collect]
permissions:
  contents: read
concurrency:
  group: collect-tudogostoso
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar coletor
        run: python -m unittest discover -s tests/tudogostoso -p 'test_*.py'
      - name: Inspecionar acesso
        if: inputs.mode == 'inspect'
        run: python scripts/tudogostoso/collector.py --mode inspect
      - name: Coletar lote de 12 candidatas
        if: inputs.mode == 'collect'
        run: python scripts/tudogostoso/collector.py --mode collect --limit 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tudogostoso-revisao
          path: .local/tudogostoso/
          retention-days: 7
          if-no-files-found: ignore
